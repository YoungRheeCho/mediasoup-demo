syntax = "proto3";

package sysinfo;

service SysInfoService {
  rpc StreamSystemInfo(Empty) returns (stream SystemInfoResponse);

  // 추가: mediasoup -> metrics agent
  rpc UpdateViewerCount(ViewerCountRequest) returns (Empty);
}

message Empty {}

message ViewerCountRequest {
  uint32 viewer_count = 1;
}

message SystemInfoResponse {
  double cpu_util_percent = 1;   // CPU 사용률 (%)
  double mem_util_percent = 2;   // 메모리 사용률 (%)
  double mem_total_mb = 3;       // 전체 메모리 (MB)
  double mem_used_mb = 4;        // 사용 중인 메모리 (MB)

  uint32 viewer_count = 5;       // 현재 Edge SFU viewer 수
}
